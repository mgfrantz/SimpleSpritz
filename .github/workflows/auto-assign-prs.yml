name: Auto-assign pull requests

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize

permissions:
  issues: write
  pull-requests: read

jobs:
  assign-owner:
    name: Assign owner
    runs-on: ubuntu-latest

    steps:
      - name: Assign pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr edit "$PR_URL" --add-assignee mgfrantz
